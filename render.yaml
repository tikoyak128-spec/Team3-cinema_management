databases:
  - name: cinema-api-db
    plan: free
    # NOTE: Render free Postgres instances expire after 30 days and are deleted.
    # Upgrade to a paid plan (or export a backup) before then if you need persistence.

services:
  - type: web
    name: cinema-api
    runtime: docker
    rootDir: backend
    dockerfilePath: Dockerfile
    plan: free
    healthCheckPath: /up
    envVars:
      # --- App ---
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: LOG_LEVEL
        value: warning
      - key: APP_URL
        value: https://team3-cinema-management.onrender.com
      - key: FRONTEND_URL
        value: https://tikoyak128-spec.github.io/Team3-cinema_management
      - key: APP_KEY
        sync: false

      # --- Database (Postgres) ---
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: cinema-api-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: cinema-api-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: cinema-api-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: cinema-api-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: cinema-api-db
          property: password

      # --- Drivers ---
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: SESSION_DRIVER
        value: database
      - key: FILESYSTEM_DISK
        value: local

      # --- Mail (SMTP via Gmail) ---
      - key: MAIL_MAILER
        value: smtp
      - key: MAIL_HOST
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_ENCRYPTION
        value: tls
      - key: MAIL_TIMEOUT
        value: "15"
      - key: MAIL_FROM_NAME
        value: Khmer Cinema
      - key: MAIL_USERNAME
        value: tikoyak128@gmail.com
      - key: MAIL_FROM_ADDRESS
        value: tikoyak128@gmail.com
      - key: MAIL_PASSWORD
        sync: false

      # --- Google OAuth ---
      - key: GOOGLE_REDIRECT_URI
        value: https://team3-cinema-management.onrender.com/api/auth/google/callback
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false

      # --- Bakong payment ---
      - key: BAKONG_API_URL
        value: https://api-bakong.nbc.gov.kh
      - key: BAKONG_MERCHANT_NAME
        value: Khmer Cinema
      - key: BAKONG_MERCHANT_CITY
        value: Phnom Penh
      - key: BAKONG_CURRENCY
        value: USD
      - key: BAKONG_API_TOKEN
        sync: false
      - key: BAKONG_ACCOUNT_ID
        sync: false

      # --- Cloudinary uploads ---
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_URL
        sync: false