<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- App Icon Background -->
  <rect width="512" height="512" rx="110" fill="#0C0C0C"/>
  <rect width="512" height="512" rx="110" fill="url(#bgGlow)"/>
  
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#222222"/>
      <stop offset="100%" stop-color="#050505"/>
    </radialGradient>
  </defs>

  <!-- Red Film Strip Top Graphic -->
  <g transform="translate(56, 140)">
    <path d="M 0 35 C 100 15, 300 15, 400 35 L 400 60 C 300 40, 100 40, 0 60 Z" fill="#E50914"/>
    <!-- Film Strip Holes -->
    <rect x="20" y="27" width="26" height="15" rx="3" fill="#0C0C0C"/>
    <rect x="80" y="22" width="26" height="15" rx="3" fill="#0C0C0C"/>
    <rect x="140" y="19" width="26" height="15" rx="3" fill="#0C0C0C"/>
    <rect x="200" y="18" width="26" height="15" rx="3" fill="#0C0C0C"/>
    <rect x="260" y="19" width="26" height="15" rx="3" fill="#0C0C0C"/>
    <rect x="320" y="22" width="26" height="15" rx="3" fill="#0C0C0C"/>
    <rect x="354" y="27" width="26" height="15" rx="3" fill="#0C0C0C"/>
  </g>

  <!-- Main Title: KHMER -->
  <text x="256" y="310" text-anchor="middle" font-family="'Montserrat', 'Arial Black', sans-serif" font-weight="900" font-size="76" fill="#FFFFFF" letter-spacing="2">KHMER</text>
  
  <!-- Subtitle: CINEMA with Red Underline Lines -->
  <g transform="translate(76, 335)">
    <path d="M 0 20 C 30 14, 60 14, 90 20" stroke="#E50914" stroke-width="4" stroke-linecap="round" fill="none"/>
    <text x="180" y="26" text-anchor="middle" font-family="'Montserrat', sans-serif" font-weight="900" font-size="30" fill="#E50914" letter-spacing="10">CINEMA</text>
    <path d="M 270 20 C 300 14, 330 14, 360 20" stroke="#E50914" stroke-width="4" stroke-linecap="round" fill="none"/>
  </g>
</svg>
